{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>Reset your password</h2>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Email<input name="email" type="email" required></label>
    <button class="btn" type="submit">Send reset link</button>
  </form>
</div>
{% endblock %}
